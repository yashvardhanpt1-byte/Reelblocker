
name: Build ReelsGuard APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q ReelsGuard_Android_Project.zip

      - name: Build debug APK
        working-directory: ReelsGuard
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ReelsGuard-debug-apk
          path: ReelsGuard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
